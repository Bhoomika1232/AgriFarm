<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>AI Crop Advisor</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-success mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold">Agri-Chain AI Lab</span>
            <a href="/dashboard" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0 p-4">
                    <h3 class="fw-bold text-success mb-4">Soil Analysis & Prediction</h3>
                    
                    <form method="POST">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Nitrogen (N)</label>
                                <input type="number" name="N" class="form-control" placeholder="0-140" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Phosphorus (P)</label>
                                <input type="number" name="P" class="form-control" placeholder="5-145" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Potassium (K)</label>
                                <input type="number" name="K" class="form-control" placeholder="5-205" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Temperature (°C)</label>
                                <input type="number" step="0.1" name="temp" class="form-control" placeholder="e.g. 25.5" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Humidity (%)</label>
                                <input type="number" step="0.1" name="hum" class="form-control" placeholder="e.g. 80" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Soil pH</label>
                                <input type="number" step="0.1" name="ph" class="form-control" placeholder="0-14" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Rainfall (mm)</label>
                                <input type="number" step="0.1" name="rain" class="form-control" placeholder="e.g. 200" required>
                            </div>
                        </div>
                        <button class="btn btn-success w-100 mt-4 fw-bold py-2">Generate AI Recommendation</button>
                    </form>

                    {% if prediction %}
<div class="mt-5 p-4 bg-success bg-opacity-10 border border-success rounded text-center">
    <h5 class="mb-1 text-success">AI Recommended Crop:</h5>
    <h2 class="fw-bold text-uppercase">{{ prediction }}</h2>
    
    <a href="/new_crop?name={{ prediction }}&n={{ request.form.N }}&p={{ request.form.P }}&k={{ request.form.K }}&temp={{ request.form.temp }}&hum={{ request.form.hum }}&ph={{ request.form.ph }}&rain={{ request.form.rain }}" 
       class="btn btn-success px-4 mt-3">
       List this Crop for Funding
    </a>
</div>
{% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
