<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Agri-Chain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; }
        .register-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-success { background-color: #198754; border: none; padding: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card register-card p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-success">Create Account</h2>
                        <p class="text-muted">Join the decentralized agricultural revolution</p>
                    </div>

                    <form action="/register" method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Username</label>
                                <input type="text" name="username" class="form-control" placeholder="johndoe123" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Role</label>
                                <select name="role" class="form-select" required>
                                    <option value="investor">Investor (Consumer)</option>
                                    <option value="farmer">Farmer (Producer)</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Phone Number</label>
                                <input type="tel" name="phone" class="form-control" placeholder="+91 0000000000" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Aadhar / Government ID</label>
                                <input type="text" name="id_number" class="form-control" placeholder="1234-5678-9012" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">Full Residential/Farm Address</label>
                            <textarea name="address" class="form-control" rows="2" placeholder="Street, City, State, ZIP" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-success w-100 shadow-sm">Register Now</button>
                        
                        <div class="text-center mt-3">
                            <p class="small text-muted">Already have an account? <a href="/login" class="text-success text-decoration-none fw-bold">Login here</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
