<!doctype html>
<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Post New Crop</title>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <span class="navbar-brand">Agri-Chain Farmer Panel</span>
        <div class="d-flex gap-3 align-items-center">
          <a href="/dashboard" class="text-white text-decoration-none"
            >Notifications</a
          >
          <a href="/my_crops" class="text-white text-decoration-none"
            >Manage Crops</a
          >
          <a href="/new_crop" class="text-white fw-bold text-decoration-none"
            >Add Crop</a
          >
          <a href="/logout" class="btn btn-outline-danger btn-sm ms-3"
            >Logout</a
          >
        </div>
      </div>
    </nav>

    <div class="container pb-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow border-0">
            <div class="card-header bg-primary text-white">
              <h5 class="mb-0">List a New Crop for Funding</h5>
            </div>
            <div class="card-body p-4">
              <form
                action="/new_crop"
                method="POST"
                enctype="multipart/form-data"
              >
                <div class="mb-3">
                  <label class="form-label text-muted">Crop Name</label>
                  <input
                    type="text"
                    name="name"
                    placeholder="e.g., Rice, SugarCane"
                    class="form-control"
                    required
                  />
                </div>
                <div class="row">
                  <div class="col-4 mb-2">
                    <label>Nitrogen (N)</label>
                    <input
                      type="number"
                      step="0.1"
                      name="n"
                      value="{{ auto_data.n }}"
                      class="form-control"
                      required
                    />
                  </div>
                  <div class="col-4 mb-2">
                    <label>Phosphorus (P)</label>
                    <input
                      type="number"
                      step="0.1"
                      name="p"
                      value="{{ auto_data.p }}"
                      class="form-control"
                      required
                    />
                  </div>
                  <div class="col-4 mb-2">
                    <label>Potassium (K)</label>
                    <input
                      type="number"
                      step="0.1"
                      name="k"
                      value="{{ auto_data.k }}"
                      class="form-control"
                      required
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-6 mb-2">
                    <label>Temp (°C)</label>
                    <input
                      type="number"
                      step="0.1"
                      name="temp"
                      value="{{ auto_data.temp }}"
                      class="form-control"
                      required
                    />
                  </div>
                  <div class="col-6 mb-2">
                    <label>Humidity (%)</label>
                    <input
                      type="number"
                      step="0.1"
                      name="hum"
                      value="{{ auto_data.hum }}"
                      class="form-control"
                      required
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-6 mb-2">
                    <label>Soil pH</label>
                    <input
                      type="number"
                      step="0.1"
                      name="ph"
                      value="{{ auto_data.ph }}"
                      class="form-control"
                      required
                    />
                  </div>
                  <div class="col-6 mb-2">
                    <label>Rainfall (mm)</label>
                    <input
                      type="number"
                      step="0.1"
                      name="rain"
                      value="{{ auto_data.rain }}"
                      class="form-control"
                      required
                    />
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label text-muted">Total Shares</label>
                    <input
                      type="number"
                      name="shares"
                      placeholder="e.g., 60"
                      class="form-control"
                      required
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label text-muted"
                      >Funding Goal (Rs. )</label
                    >
                    <input
                      type="number"
                      name="goal"
                      placeholder="e.g., 5000"
                      class="form-control"
                      required
                    />
                  </div>
                </div>
                <div class="mb-4">
                  <label class="form-label text-muted">Geotagged Image</label>
                  <input
                    type="file"
                    name="image"
                    class="form-control"
                    required
                  />
                </div>
                <button class="btn btn-primary w-100 fw-bold py-2">
                  Create Smart Contract & List Crop
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
