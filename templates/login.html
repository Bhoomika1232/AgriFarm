<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Agri-Chain Login</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4 card shadow-sm p-4">
                <h3 class="text-center mb-4">Login to Agri-Chain</h3>
                
                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    {% for message in messages %}
                      <div class="alert alert-warning py-2 small text-center">{{ message }}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label>Username (Email)</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label>Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                    <button class="btn btn-primary w-100">Sign In</button>
                </form>
                <div class="text-center mt-3">
                    <p class="small">New to the platform? <a href="/register">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
